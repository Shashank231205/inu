# STT bake-off (Phase 6). Run: uv run inu bench stt [--engines a,b] [--datasets x]
# CPU only: the GPU belongs to the LLM in the real-time path (ADR 0002).
data_dir: data/benchmarks
cpu_threads: 8          # physical cores on the i7-11800H
warmup_utterances: 2
short_seconds: 5.0

datasets:
  librispeech-clean:
    kind: librispeech
    source: https://www.openslr.org/resources/12/test-clean.tar.gz
    utterances: 120
    seed: 7
    min_seconds: 1.5
    max_seconds: 12
  # Indian-accented English. Gated on Hugging Face: accept the terms, then `uv run hf auth login`.
  svarah:
    kind: hf_parquet
    source: ai4bharat/Svarah
    utterances: 120
    seed: 7
    min_seconds: 1.5
    max_seconds: 12

engines:
  - {name: whisper-base.en, kind: faster_whisper, model: base.en}
  - {name: whisper-small.en, kind: faster_whisper, model: small.en}
  - {name: whisper-distil-small.en, kind: faster_whisper, model: distil-small.en}
  - {name: whisper-distil-large-v3.5, kind: faster_whisper, model: distil-large-v3.5}
  - {name: whisper-large-v3-turbo, kind: faster_whisper, model: large-v3-turbo}
  - {name: parakeet-tdt-0.6b-v2, kind: onnx_asr, model: nemo-parakeet-tdt-0.6b-v2, quantization: int8}
  - {name: parakeet-tdt-0.6b-v3, kind: onnx_asr, model: nemo-parakeet-tdt-0.6b-v3, quantization: int8}
  - {name: canary-1b-v2, kind: onnx_asr, model: nemo-canary-1b-v2, quantization: int8}
  - {name: moonshine-tiny, kind: moonshine, model: tiny}
  - {name: moonshine-base, kind: moonshine, model: base}
  - {name: moonshine-small-streaming, kind: moonshine, model: small_streaming}
  - {name: moonshine-medium-streaming, kind: moonshine, model: medium_streaming}
