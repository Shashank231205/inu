name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  checks:
    # No earlier steps can alter the checkout here. Switch to `$/` once actionlint supports it.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --package inu-core --short)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match inu-core version ${version}"
            exit 1
          fi

      - run: uv build --all-packages --out-dir dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" dist/* --verify-tag --generate-notes
