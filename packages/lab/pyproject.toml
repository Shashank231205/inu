[project]
name = "inu-lab"
version = "0.1.0"
description = "INU benchmarks and experiments. Development only; never deployed."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.0",  # tokenizers (via faster-whisper) requires <2.0
    "inu-core",
    "jiwer>=4.0.0",
    "numpy>=2.5.3",
    "soundfile>=0.14.0",
    "truststore>=0.10.4",
    "whisper-normalizer>=0.1.15",
]

[project.entry-points."inu.commands"]
bench = "inu_lab.cli:BenchCommand"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
