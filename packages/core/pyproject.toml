[project]
name = "inu-core"
version = "0.1.0"
description = "INU core library: domain model, interfaces and orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic-settings[yaml]>=2.15.0",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
]

[project.scripts]
inu = "inu.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "inu"
