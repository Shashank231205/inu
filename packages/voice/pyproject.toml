[project]
name = "inu-voice"
version = "0.1.0"
description = "INU real-time voice: audio I/O, and later VAD, speech-to-text and text-to-speech"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inu-core",
    "numpy>=2.5.3",
    "sounddevice>=0.5.6",
    "soxr>=1.1.0",
]

[project.entry-points."inu.commands"]
audio = "inu_voice.cli:AudioCommand"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
inu-core = { workspace = true }
