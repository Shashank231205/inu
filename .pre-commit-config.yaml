default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # gitleaks runs in CI; locally Windows blocks its unsigned binary (ADR 0003)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # SOPS files are ciphertext; the guards below check they stay that way.
        exclude: ^(uv\.lock|secrets/.*\.enc\.env)$

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--offline]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: sops-values-encrypted
        name: secrets files hold only encrypted values
        language: pygrep
        entry: '^INU_\w+=(?!ENC\[).+$'
        files: ^secrets/.*\.enc\.env$
      - id: sops-metadata-present
        name: secrets files carry SOPS metadata
        language: pygrep
        entry: '^sops_mac='
        args: [--negate]
        files: ^secrets/.*\.enc\.env$
      - id: mypy
        name: mypy (strict)
        entry: uv run poe typecheck
        language: system
        types: [python]
        pass_filenames: false
