apiVersion: 1
datasources:
  - name: Prometheus
    uid: inu-prometheus
    type: prometheus
    access: proxy
    url: $INU_PROMETHEUS_URL
    isDefault: true
    jsonData:
      # Exemplar dots on latency graphs open the turn's trace in Jaeger.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: inu-jaeger
  - name: Jaeger
    uid: inu-jaeger
    type: jaeger
    access: proxy
    url: $INU_JAEGER_URL
